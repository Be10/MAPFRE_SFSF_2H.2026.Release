<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MAPFRE — SAP SuccessFactors 2H 2026 Release overview across the SAP SuccessFactors suite." />
  <meta name="theme-color" content="#e30613" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (() => {
      try {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="https://www.mapfre.com/contents/ui/theme/resources/images/menu-logo-active-desktop.svg" />
  <link rel="shortcut icon" href="https://www.mapfre.com/contents/ui/theme/resources/images/menu-logo-active-desktop.svg" />
  <title>MAPFRE | SAP SFSF 2H 2026 Release</title>
  <style>
    :root {
      --mapfre-red: #e30613;
      --mapfre-red-2: #c90012;
      --sap-blue: #0a6ed1;
      --success: #168447;
      --warning: #c26a00;
      --info: #1865a8;
      --danger: #bc2b38;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --surface-3: #e8ebef;
      --text: #19202a;
      --muted: #66717e;
      --border: #dfe3e8;
      --shadow: 0 10px 35px rgba(19, 30, 45, .08);
      --shadow-soft: 0 4px 18px rgba(19, 30, 45, .06);
      --radius: 20px;
      --radius-sm: 12px;
      --max: 1480px;
    }

    html[data-theme="dark"] {
      --bg: #0e1117;
      --surface: #171b22;
      --surface-2: #20262f;
      --surface-3: #2a313c;
      --text: #f4f6f8;
      --muted: #a8b0bc;
      --border: #303844;
      --shadow: 0 10px 35px rgba(0, 0, 0, .28);
      --shadow-soft: 0 4px 18px rgba(0, 0, 0, .22);
      --success: #57c984;
      --warning: #ffb55d;
      --info: #72b8ff;
      --danger: #ff7c88;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.52;
      transition: background .25s ease, color .25s ease;
    }
    button, input, select { font: inherit; }
    a { color: inherit; }
    .shell { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: color-mix(in srgb, var(--mapfre-red) 94%, #111);
      border-bottom: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 8px 28px rgba(115,0,12,.18);
    }
    .topbar-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand-group { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .mapfre-logo {
      display: block;
      width: 174px;
      height: auto;
      flex: 0 0 auto;
    }
    .divider { width: 1px; height: 30px; background: rgba(255,255,255,.28); }
    .product-title { min-width: 0; color: #fff; }
    .product-title strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-title span { color: rgba(255,255,255,.74); font-size: 12px; }
    .actions { display: flex; align-items: center; gap: 9px; }
    .icon-btn, .action-btn {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.10);
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      backdrop-filter: blur(8px);
    }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; }
    .action-btn { padding: 9px 14px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
    .icon-btn:hover, .action-btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.58); background: rgba(255,255,255,.18); }
    .action-btn.primary { background: #fff; color: var(--mapfre-red); border-color: #fff; }
    .ui-icon { width: 17px; height: 17px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn .ui-icon { width: 18px; height: 18px; }
    .theme-toggle {
      opacity: .76;
      background: rgba(255,255,255,.045);
      border-color: rgba(255,255,255,.16);
      color: rgba(255,255,255,.84);
    }
    .theme-toggle:hover {
      opacity: 1;
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.28);
    }
    .theme-toggle .ui-icon { width: 22px; height: 22px; stroke-width: 0; }
    .theme-toggle .theme-fill { fill: currentColor; stroke: none; }
    mark.search-hit {
      background: rgba(227, 6, 19, .21);
      color: inherit;
      border-radius: 4px;
      padding: 0 .08em;
      box-shadow: inset 0 0 0 1px rgba(227, 6, 19, .28), inset 0 -2px 0 rgba(227, 6, 19, .18);
    }
    html[data-theme="dark"] mark.search-hit {
      background: rgba(255, 92, 104, .36);
      color: #fff7f8;
      box-shadow: inset 0 0 0 1px rgba(255, 137, 146, .42);
    }

    .section-title-row { margin: 34px 0 14px; }
    .section-title-row .inline-title { margin: 0; font-size: 27px; letter-spacing: -.035em; line-height: 1.2; }
    .section-title-row .inline-title .title-sub { color: var(--muted); font-size: 15px; font-weight: 550; letter-spacing: -.01em; }

    .takeaways-viewport {
      position: relative;
      overflow: hidden;
      padding: 8px 2px 18px;
      margin: 0 -2px;
    }
    .takeaways {
      display: flex;
      align-items: stretch;
      gap: 12px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 8px 30px 18px 2px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--muted) 32%, transparent) transparent;
      overscroll-behavior-inline: contain;
      cursor: grab;
      user-select: none;
    }
    .takeaways:active { cursor: grabbing; }
    .takeaways::-webkit-scrollbar { height: 6px; }
    .takeaways::-webkit-scrollbar-track { background: transparent; }
    .takeaways::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 28%, transparent); border-radius: 999px; }
    .takeaway {
      flex: 0 0 clamp(310px, 26vw, 390px);
      min-height: 205px;
      scroll-snap-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 21px 18px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform .24s ease, opacity .24s ease, border-color .24s ease, box-shadow .24s ease, filter .24s ease;
      opacity: .80;
      filter: saturate(.90);
      z-index: 1;
    }
    .takeaway::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background: var(--accent, var(--mapfre-red)); }
    .takeaway::after {
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      border-radius:50%;
      right:-74px;
      top:-78px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      pointer-events:none;
    }
    .takeaway.active {
      opacity: 1;
      filter: saturate(1);
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent) 44%, var(--border));
      box-shadow: 0 17px 40px color-mix(in srgb, var(--accent) 12%, rgba(18, 31, 49, .12));
      z-index: 20;
    }
    .takeaway:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 32%, transparent); outline-offset: 2px; }
    .takeaway-head { display:flex; align-items:center; gap:11px; position:relative; z-index:1; }
    .takeaway-icon {
      width:38px;
      height:38px;
      border-radius:12px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      color:#fff;
      background:var(--accent);
      box-shadow:0 8px 20px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .takeaway-icon svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
    .takeaway .module-tag { color: var(--accent, var(--mapfre-red)); font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .075em; line-height:1.25; }
    .takeaway-count { margin-left:auto; color:var(--muted); font-size:10px; font-weight:850; white-space:nowrap; }
    .takeaway h3 { margin: 14px 0 7px; font-size: 19px; line-height:1.25; letter-spacing:-.022em; position:relative; z-index:1; }
    .takeaway p { color: var(--muted); margin: 0; font-size: 13px; line-height:1.55; position:relative; z-index:1; }
    .takeaway-hint { margin-top:9px; color: color-mix(in srgb, var(--muted) 78%, transparent); font-size:10px; font-weight:750; display:none; }

    .controlbar {
      margin: 28px 0 18px;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow-soft);
    }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .module-filters { flex-wrap: wrap; overflow: visible; border: 0; background: transparent; gap: 6px; }
    .module-filters button { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); }
    .segmented button { border: 0; background: transparent; color: var(--muted); padding: 9px 14px; cursor: pointer; font-weight: 800; font-size: 12px; }
    .segmented button.active { color: #fff; background: var(--mapfre-red); }
    .search-wrap { flex: 1 1 320px; position: relative; }
    .search-wrap input { width: 100%; padding: 10px 15px 10px 38px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 999px; outline: none; }
    .search-wrap .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; pointer-events: none; }
    select { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 9px 33px 9px 13px; font-weight: 700; font-size: 12px; }

    .module-section { margin: 18px 0 38px; scroll-margin-top: 100px; }
    .module-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 15px;
      align-items: center;
      margin-bottom: 13px;
    }
    .module-icon { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: var(--accent); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 24%, transparent); }
    .module-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .module-header h3 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .module-header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .module-count { color: var(--muted); font-weight: 800; font-size: 12px; }

    .cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .release-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      transition: transform .17s ease, box-shadow .17s ease, border-color .17s ease;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .release-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
    .card-top { display: flex; justify-content: space-between; align-items: start; gap: 15px; }
    .card-kicker { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; font-weight: 900; }
    .release-card h4 { margin: 5px 0 0; font-size: 19px; line-height: 1.25; letter-spacing: -.022em; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
    .chip { border-radius: 999px; padding: 6px 9px; font-size: 10px; font-weight: 900; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); }
    .chip.new { background: color-mix(in srgb, var(--sap-blue) 12%, var(--surface)); color: var(--info); border-color: color-mix(in srgb, var(--sap-blue) 26%, var(--border)); }
    .chip.changed { background: color-mix(in srgb, var(--warning) 10%, var(--surface)); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 23%, var(--border)); }
    .chip.deprecated { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 23%, var(--border)); }
    .impact-text { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
    .assessment {
      border-radius: 13px;
      padding: 11px 12px;
      margin-top: auto;
      background: color-mix(in srgb, var(--success) 8%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--success) 24%, var(--border));
      color: var(--success);
      font-weight: 850;
      font-size: 12.5px;
    }
    .assessment.review { color: var(--warning); background: color-mix(in srgb, var(--warning) 8%, var(--surface)); border-color: color-mix(in srgb, var(--warning) 22%, var(--border)); }
    .card-footer { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .doc-link { color: var(--sap-blue); font-weight: 850; font-size: 12px; text-decoration: none; }
    .doc-link:hover { text-decoration: underline; }
    .more-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-weight: 850; font-size: 12px; display:inline-flex; align-items:center; gap:5px; }
    .more-btn .ui-icon { width:14px; height:14px; }

    .details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 12.5px; }
    .release-card.open .details { display: block; }
    .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .detail-box { background: var(--surface-2); border-radius: 10px; padding: 9px; }
    .detail-box small { display: block; text-transform: uppercase; letter-spacing: .06em; font-size: 9px; font-weight: 900; margin-bottom: 3px; }
    .detail-box strong { color: var(--text); font-size: 11px; }


    .empty { display: none; padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

    footer { margin: 44px 0 30px; padding: 22px 0 8px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 22px; color: var(--muted); font-size: 11px; }
    footer strong { color: var(--text); }
    .ntt-mark { display: inline-flex; align-items: center; padding: 0; border-radius: 0; background: transparent; border: 0; white-space: nowrap; }
    .ntt-logo { display: block; width: 108px; height: auto; max-height: 28px; object-fit: contain; opacity: 1; background: transparent; }
    [data-theme="dark"] .ntt-mark { background: transparent; border: 0; }


    @media (max-width: 980px) {
      .takeaway { flex-basis: 340px; }
      .cards { grid-template-columns: 1fr; }
    }
    @media (max-width: 650px) {
      footer { grid-template-columns: 1fr; gap: 10px; }
      .ntt-mark { justify-self: start; padding: 0; }
      .shell { padding: 0 14px; }
      .topbar-inner { height: 64px; }
      .product-title, .divider, .action-btn span { display: none; }
      .section-title-row .inline-title { font-size: 21px; }
      .section-title-row .inline-title .title-sub { font-size:12.5px; }
      .takeaways-viewport { margin-inline:-14px; padding-inline:0; }
      .takeaways { padding:8px 28px 18px 14px; scroll-snap-type:x mandatory; }
      .takeaway { flex-basis: 84vw; min-height: 214px; opacity:.82; }
      .takeaway.active { transform: translateY(-3px) scale(1); }
      .takeaway-hint { display:block; }
      .details-grid { grid-template-columns: 1fr; }
      footer { flex-direction: column; }
    }

  </style>
</head>

let activeTakeawayModule = "Employee Central";
let takeawayPointerDown = false;
let takeawayDragStartX = 0;
let takeawayDragStartScroll = 0;
let takeawayScrollRAF = null;

function renderTakeaways(){
  const rail = document.getElementById('takeawaysRail');
  if (!rail) return;
  const counts = releaseData.reduce((acc, item) => {
    acc[item.module] = (acc[item.module] || 0) + 1;
    return acc;
  }, {});
  rail.innerHTML = Object.keys(moduleMeta).map(moduleName => {
    const meta = moduleMeta[moduleName];
    const summary = takeawayMeta[moduleName];
    const isActive = moduleName === activeTakeawayModule;
    return `<article class="takeaway${isActive ? ' active' : ''}" tabindex="0" role="button" aria-pressed="${isActive}" data-takeaway-module="${escapeHtml(moduleName)}" style="--accent:${meta.accent}">
      <div class="takeaway-head">
        <div class="takeaway-icon">${moduleIconSvg(moduleName)}</div>
        <div class="module-tag">${escapeHtml(moduleName)}</div>
        <div class="takeaway-count">${counts[moduleName] || 0} item${(counts[moduleName] || 0) === 1 ? '' : 's'}</div>
      </div>
      <h3>${escapeHtml(summary.title)}</h3>
      <p>${escapeHtml(summary.description)}</p>
      <div class="takeaway-hint">Swipe to explore modules</div>
    </article>`;
  }).join('');
  bindTakeawayInteractions();
}

function activateTakeaway(moduleName, options = {}){
  if (!moduleMeta[moduleName]) return;
  activeTakeawayModule = moduleName;
  document.querySelectorAll('.takeaway[data-takeaway-module]').forEach(card => {
    const active = card.dataset.takeawayModule === moduleName;
    card.classList.toggle('active', active);
    card.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  if (options.scrollIntoView) {
    const card = document.querySelector(`.takeaway[data-takeaway-module="${CSS.escape(moduleName)}"]`);
    card?.scrollIntoView({behavior: options.smooth === false ? 'auto' : 'smooth', block:'nearest', inline:'center'});
  }
}

function updateTakeawayFromScroll(){
  const rail = document.getElementById('takeawaysRail');
  if (!rail || window.matchMedia('(min-width: 981px)').matches) return;
  const cards = [...rail.querySelectorAll('.takeaway')];
  if (!cards.length) return;
  const railRect = rail.getBoundingClientRect();
  const center = railRect.left + railRect.width / 2;
  let closest = cards[0];
  let best = Infinity;
  for (const card of cards) {
    const rect = card.getBoundingClientRect();
    const distance = Math.abs((rect.left + rect.width / 2) - center);
    if (distance < best) { best = distance; closest = card; }
  }
  activateTakeaway(closest.dataset.takeawayModule);
}

function bindTakeawayInteractions(){
  const rail = document.getElementById('takeawaysRail');
  if (!rail) return;
  const cards = [...rail.querySelectorAll('.takeaway')];
  cards.forEach(card => {
    const moduleName = card.dataset.takeawayModule;
    card.addEventListener('mouseenter', () => {
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) activateTakeaway(moduleName);
    });
    card.addEventListener('focus', () => activateTakeaway(moduleName));
    card.addEventListener('click', () => activateTakeaway(moduleName, {scrollIntoView:true}));
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateTakeaway(moduleName, {scrollIntoView:true});
      }
    });
  });

  rail.addEventListener('scroll', () => {
    cancelAnimationFrame(takeawayScrollRAF);
    takeawayScrollRAF = requestAnimationFrame(updateTakeawayFromScroll);
  }, {passive:true});

  rail.addEventListener('wheel', event => {
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX) && rail.scrollWidth > rail.clientWidth) {
      event.preventDefault();
      rail.scrollLeft += event.deltaY;
    }
  }, {passive:false});

  rail.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse') return;
    takeawayPointerDown = true;
    takeawayDragStartX = event.clientX;
    takeawayDragStartScroll = rail.scrollLeft;
    rail.setPointerCapture?.(event.pointerId);
  });
  rail.addEventListener('pointermove', event => {
    if (!takeawayPointerDown || event.pointerType !== 'mouse') return;
    const dx = event.clientX - takeawayDragStartX;
    if (Math.abs(dx) > 3) rail.scrollLeft = takeawayDragStartScroll - dx;
  });
  const endDrag = event => {
    if (!takeawayPointerDown) return;
    takeawayPointerDown = false;
    try { rail.releasePointerCapture?.(event.pointerId); } catch (_) {}
  };
  rail.addEventListener('pointerup', endDrag);
  rail.addEventListener('pointercancel', endDrag);

  requestAnimationFrame(() => activateTakeaway(activeTakeawayModule, {scrollIntoView:false, smooth:false}));
}

function typeClass(type){
  const t = type.toLowerCase();
  if (t.includes("deprecated")) return "deprecated";
  if (t.includes("new")) return "new";
  return "changed";
}

function escapeHtml(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function searchTerms(){
  return [...new Set(state.search.trim().split(/\s+/).filter(Boolean))];
}

function highlightText(value){
  const raw = String(value ?? '');
  const terms = searchTerms();
  if (!terms.length) return escapeHtml(raw);
  const escapedTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b) => b.length - a.length);
  const re = new RegExp(`(${escapedTerms.join('|')})`, 'gi');
  let out = '';
  let last = 0;
  raw.replace(re, (match, _group, offset) => {
    out += escapeHtml(raw.slice(last, offset));
    out += `<mark class="search-hit">${escapeHtml(match)}</mark>`;
    last = offset + match.length;
    return match;
  });
  out += escapeHtml(raw.slice(last));
  return out;
}

function matches(item){
  if (state.module !== "all" && item.module !== state.module) return false;
  const terms = searchTerms().map(t => t.toLowerCase());
  if (!terms.length) return true;
  const haystack = `${item.feature} ${item.classification} ${item.sapType} ${item.enablement} ${item.impact} ${item.assessment||''}`.toLowerCase();
  return terms.every(term => haystack.includes(term));
}

function render(){
  const root = document.getElementById('modulesRoot');
  root.innerHTML = '';
  let totalVisible = 0;
  Object.keys(moduleMeta).forEach(moduleName => {
    const items = releaseData.filter(x => x.module === moduleName && matches(x));
    if (!items.length) return;
    totalVisible += items.length;
    const meta = moduleMeta[moduleName];
    const section = document.createElement('section');
    section.className = 'module-section';
    section.id = moduleName.toLowerCase().replace(/\s+/g,'-');
    section.style.setProperty('--accent', meta.accent);
    section.innerHTML = `
      <div class="module-header">
        <div class="module-icon">${moduleIconSvg(moduleName)}</div>
        <div><h3>${moduleName}</h3><p>${meta.subtitle}</p></div>
        <div class="module-count">${items.length} item${items.length>1?'s':''}</div>
      </div>
      <div class="cards">${items.map(cardHtml).join('')}</div>
    `;
    root.appendChild(section);
  });
  document.getElementById('emptyState').style.display = totalVisible ? 'none' : 'block';
  bindCardButtons();
}

function cardHtml(item){
  return `<article class="release-card" style="--accent:${item.accent}">
    <div class="card-top">
      <div><div class="card-kicker">${highlightText(item.classification)}</div><h4>${highlightText(item.feature)}</h4></div>
    </div>
    <div class="chips">
      <span class="chip ${typeClass(item.sapType)}">${highlightText(item.sapType)}</span>
      <span class="chip">${highlightText(item.enablement)}</span>
    </div>
    <p class="impact-text">${highlightText(item.impact)}</p>
    ${item.assessment ? `<div class="assessment ${item.assessmentClass==='review'?'review':''}">${highlightText(item.assessment)}</div>` : ''}
    <div class="details">
      <div class="details-grid">
        <div class="detail-box"><small>Classification</small><strong>${highlightText(item.classification)}</strong></div>
        <div class="detail-box"><small>SAP Type</small><strong>${highlightText(item.sapType)}</strong></div>
        <div class="detail-box"><small>Enablement</small><strong>${highlightText(item.enablement)}</strong></div>
      </div>
    </div>
    <div class="card-footer">
      <a class="doc-link" href="${item.url}" target="_blank" rel="noopener">Official SAP Documentation <svg class="ui-icon" style="display:inline-block;width:13px;height:13px;vertical-align:-2px" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7"></path><path d="M10 14 21 3"></path><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path></svg></a>
      <button class="more-btn" type="button">Details <svg class="ui-icon details-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
  </article>`;
}


function bindCardButtons(){
  document.querySelectorAll('.more-btn').forEach(btn => btn.addEventListener('click', () => {
    const card = btn.closest('.release-card');
    card.classList.toggle('open');
    btn.innerHTML = card.classList.contains('open')
      ? 'Details <svg class="ui-icon details-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>'
      : 'Details <svg class="ui-icon details-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>';
  }));
}

let manualThemeOverride = null;
const colorSchemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  const icon = document.getElementById('themeIcon');
  const button = document.getElementById('themeToggle');
  if (!icon || !button) return;
  const isDark = theme === 'dark';
  icon.innerHTML = isDark
    ? '<g class="theme-fill"><circle cx="12" cy="12" r="5.25"></circle><circle cx="12" cy="2.7" r="1.35"></circle><circle cx="12" cy="21.3" r="1.35"></circle><circle cx="2.7" cy="12" r="1.35"></circle><circle cx="21.3" cy="12" r="1.35"></circle><circle cx="5.45" cy="5.45" r="1.25"></circle><circle cx="18.55" cy="5.45" r="1.25"></circle><circle cx="5.45" cy="18.55" r="1.25"></circle><circle cx="18.55" cy="18.55" r="1.25"></circle></g>'
    : '<path class="theme-fill" d="M21.55 14.85A9.55 9.55 0 0 1 9.15 2.45a9.5 9.5 0 1 0 12.4 12.4Z"></path>';
  button.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
  button.setAttribute('title', isDark ? 'Switch to light theme' : 'Switch to dark theme');
}

function applySystemTheme(e){
  if (manualThemeOverride) return;
  const isDark = e ? e.matches : (colorSchemeQuery && colorSchemeQuery.matches);
  setTheme(isDark ? 'dark' : 'light');
}

// Start from the device/browser theme. The header button provides a temporary manual override.
applySystemTheme(colorSchemeQuery);
if (colorSchemeQuery) {
  if (typeof colorSchemeQuery.addEventListener === 'function') {
    colorSchemeQuery.addEventListener('change', applySystemTheme);
  } else if (typeof colorSchemeQuery.addListener === 'function') {
    colorSchemeQuery.addListener(applySystemTheme);
  }
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  manualThemeOverride = nextTheme;
  setTheme(nextTheme);
});

// Controls
document.querySelectorAll('#moduleToggle button').forEach(b => b.addEventListener('click', () => {
  state.module = b.dataset.module;
  document.querySelectorAll('#moduleToggle button').forEach(x => x.classList.toggle('active', x === b));
  render();
}));
document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; render(); });

renderTakeaways();
render();
</script>
