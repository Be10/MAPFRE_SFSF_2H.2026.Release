            letter-spacing: 0.05em;

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;

        }

        }

                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        function renderFilters() {
            // Orden estricto solicitado: All Modules, Employee Central, Compensation, Time Tracking, Performance & Goals, y el resto consecutivo
            const priorityOrder = ['All', 'Employee Central', 'Compensation', 'Time Tracking', 'Performance & Goals', 'Platform', 'Onboarding', 'Learning', 'Extra Enhancements'];
            const availableModules = [...new Set(releaseData.map(item => item.module))];
            
            const modules = priorityOrder.filter(m => m === 'All' || availableModules.includes(m));
            availableModules.forEach(m => { if (!modules.includes(m)) modules.push(m); });

            const container = document.getElementById('filterContainer');
            container.innerHTML = '';

            const moduleIcons = {
                'All': 'fa-layer-group',
                'Employee Central': 'fa-sitemap',
                'Compensation': 'fa-money-bill-trend-up',
                'Time Tracking': 'fa-clock',
                'Performance & Goals': 'fa-bullseye',
                'Platform': 'fa-server',
                'Onboarding': 'fa-user-plus',
                'Learning': 'fa-graduation-cap',
                'Extra Enhancements': 'fa-plus-circle'
            };

            modules.forEach(mod => {
                const btn = document.createElement('button');
                
                let displayText = mod;
                if (mod === 'All') displayText = currentLang === 'en' ? uiDict.en.filterAll : uiDict.es.filterAll;
                if (mod === 'Extra Enhancements') displayText = currentLang === 'en' ? 'Extra Enhancements' : 'Mejoras Extra';
                
                const iconClass = moduleIcons[mod] || 'fa-cube';
                const count = mod === 'All' ? releaseData.length : releaseData.filter(item => item.module === mod).length;
                
                btn.className = `flex-shrink-0 md:w-full text-left px-3 py-2 rounded-full md:rounded-lg text-xs md:text-sm font-medium transition-colors duration-200 focus:outline-none flex justify-between items-center gap-3 md:gap-0 snap-start ${
                    currentFilter === mod 
                    ? 'bg-mapfre-red text-white shadow-md' 
                    : 'bg-gray-100 dark:bg-gray-800 md:bg-transparent text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'
                }`;
                
                if (currentFilter === mod) {
                    btn.innerHTML = `
                        <div class="flex items-center whitespace-nowrap md:truncate md:pr-2">
                            <i class="fa-solid ${iconClass} w-5 text-center mr-1.5 opacity-90"></i>
                            <span class="whitespace-nowrap md:truncate">${displayText}</span> 
                        </div>
                        <span class="bg-white/20 text-white text-[0.65rem] py-0.5 px-2 rounded-full font-bold flex-shrink-0">${count}</span>
                    `;
                } else {
                    btn.innerHTML = `
                        <div class="flex items-center whitespace-nowrap md:truncate md:pr-2">
                            <i class="fa-solid ${iconClass} w-5 text-center mr-1.5 opacity-60"></i>
                            <span class="whitespace-nowrap md:truncate">${displayText}</span> 
                        </div>
                        <span class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-[0.65rem] py-0.5 px-2 rounded-full font-bold flex-shrink-0">${count}</span>
                    `;
                }

                btn.onclick = () => {
                    currentFilter = mod;
                    renderFilters(); 
                    renderCards();
                };
                container.appendChild(btn);
            });
        }

        function handleSearch(event) {
            currentSearch = event.target.value.toLowerCase();
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            let filteredData = currentFilter === 'All' 
                ? releaseData 
                : releaseData.filter(item => item.module === currentFilter);

            if (currentSearch.trim() !== '') {
                const searchStr = currentSearch.trim();
                filteredData = filteredData.filter(item => {
                    const title = (currentLang === 'en' ? item.titleEn : item.titleEs).toLowerCase();
                    const desc = (currentLang === 'en' ? item.descEn : item.descEs).toLowerCase();
                    const moduleName = item.module.toLowerCase();
                    const typeText = (currentLang === 'es' ? (item.type === 'New' ? uiDict.es.typeNew : uiDict.es.typeChanged) : item.type).toLowerCase();
                    
                    return title.includes(searchStr) || desc.includes(searchStr) || moduleName.includes(searchStr) || typeText.includes(searchStr);
                });
            }

            // Orden universal: Lo crítico siempre va primero, luego por ID
            filteredData.sort((a, b) => {
                if (a.isCritical && !b.isCritical) return -1;
                if (!a.isCritical && b.isCritical) return 1;
                return a.id - b.id;
            });
            
            currentFilteredData = filteredData;

            const btnReadMoreText = currentLang === 'en' ? uiDict.en.btnReadMore : uiDict.es.btnReadMore;
            const lblCriticalText = currentLang === 'en' ? 'CRITICAL' : 'CRÍTICO';
            const criticalTooltip = currentLang === 'en' ? uiDict.en.tooltipCritical : uiDict.es.tooltipCritical;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 px-4 text-center animate-fade-in">
                        <div class="bg-gray-100 dark:bg-gray-800 rounded-full w-16 h-16 flex items-center justify-center mb-4 transition-colors duration-300">
                            <i class="fa-solid fa-magnifying-glass text-2xl text-gray-400 dark:text-gray-500"></i>
                        </div>
                        <p class="text-gray-600 dark:text-gray-400 text-base font-medium">${uiDict[currentLang].noResults} "<span class="text-gray-900 dark:text-white font-bold">${currentSearch}</span>"</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach((item, index) => {
                const title = currentLang === 'en' ? item.titleEn : item.titleEs;
                
                const criticalBadge = item.isCritical 
                    ? `<div class="flex items-center gap-1 text-amber-600 dark:text-amber-400" title="${criticalTooltip}">
                           <i class="fa-solid fa-star text-xs flex-shrink-0"></i>
                           <span class="text-[0.65rem] font-bold uppercase tracking-wider leading-none mt-[1px]">${lblCriticalText}</span>
                       </div>` 
                    : `<div></div>`;
                
                let typeText = item.type;
                if (currentLang === 'es') {
                    typeText = item.type === 'New' ? uiDict.es.typeNew : uiDict.es.typeChanged;
                }

                const typeColor = item.type === 'New' 
                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300' 
                    : 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300';
                
                const typeIcon = item.type === 'New' ? 'fa-plus' : 'fa-pen-to-square';
                const typeTooltip = item.type === 'New' 
                    ? (currentLang === 'en' ? uiDict.en.tooltipNew : uiDict.es.tooltipNew) 
                    : (currentLang === 'en' ? uiDict.en.tooltipChanged : uiDict.es.tooltipChanged);

                let moduleText = item.module === 'Extra Enhancements' && currentLang === 'es' ? 'Mejoras Extra' : item.module;
                if (item.module === 'Extra Enhancements' && item.subModulesEn) {
                    moduleText += ` • <span class="text-gray-500 dark:text-gray-400 font-medium">${currentLang === 'en' ? item.subModulesEn : item.subModulesEs}</span>`;
                }

                const cardHTML = `
                    <div onclick="openModal(${item.id})" class="bg-white dark:bg-mapfre-cardDark rounded-xl p-4 md:p-5 shadow-sm border border-gray-100 dark:border-gray-700 card-hover flex flex-col h-full cursor-pointer transition-all duration-300 group animate-fade-in" style="opacity: 0; animation-delay: ${index * 0.04}s">
                        <div class="flex justify-between items-start mb-2 gap-2">
                            <span class="text-xs font-bold text-mapfre-red dark:text-red-400 uppercase tracking-wider">${moduleText}</span>
                            <span class="tag whitespace-nowrap shrink-0 ${typeColor}" title="${typeTooltip}">
                                <i class="fa-solid ${typeIcon} mr-1"></i> ${typeText}
                            </span>
                        </div>
                        
                        <h3 class="text-base font-bold mb-2 text-gray-900 dark:text-white leading-tight">${title}</h3>
                        
                        <div class="mt-auto pt-2 flex justify-between items-center w-full">
                            ${criticalBadge}
                            <div class="flex items-center text-sm font-semibold text-mapfre-red dark:text-red-400 ml-auto">
                                <span>${btnReadMoreText}</span>
                                <i class="fa-solid fa-arrow-right ml-1.5 transform group-hover:translate-x-1 transition-transform duration-300"></i>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function openModal(id) {
            currentOpenItemId = id;
            const item = releaseData.find(d => d.id === id);
            if (!item) return;

            const title = currentLang === 'en' ? item.titleEn : item.titleEs;
            const desc = currentLang === 'en' ? item.descEn : item.descEs;
            const impact = currentLang === 'en' ? item.impactEn : item.impactEs;
            
            let typeText = item.type;
            if (currentLang === 'es') {
                typeText = item.type === 'New' ? uiDict.es.typeNew : uiDict.es.typeChanged;
            }

            let moduleText = item.module === 'Extra Enhancements' && currentLang === 'es' ? 'Mejoras Extra' : item.module;
            if (item.module === 'Extra Enhancements' && item.subModulesEn) {
                moduleText += ` • <span class="text-gray-500 dark:text-gray-400 font-medium">${currentLang === 'en' ? item.subModulesEn : item.subModulesEs}</span>`;
            }

            const typeColor = item.type === 'New' 
                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300' 
                : 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300';
            const typeIcon = item.type === 'New' ? 'fa-plus' : 'fa-pen-to-square';
            const typeTooltip = item.type === 'New' ? uiDict[currentLang].tooltipNew : uiDict[currentLang].tooltipChanged;

            document.getElementById('modalModule').innerHTML = moduleText;
            document.getElementById('modalType').className = `tag whitespace-nowrap shrink-0 w-fit flex items-center ${typeColor}`;
            document.getElementById('modalType').innerHTML = `<i class="fa-solid ${typeIcon} mr-1.5"></i> ${typeText}`;
            document.getElementById('modalType').title = typeTooltip;
            
            const modalCritical = document.getElementById('modalCritical');
            if (item.isCritical) {
                modalCritical.className = 'tag whitespace-nowrap shrink-0 w-fit flex items-center bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300';
                modalCritical.innerHTML = `<i class="fa-solid fa-star mr-1.5"></i> ${currentLang === 'en' ? uiDict.en.lblCritical : uiDict.es.lblCritical}`;
                modalCritical.title = uiDict[currentLang].tooltipCritical;
                modalCritical.classList.remove('hidden');
            } else {
                modalCritical.classList.add('hidden');
                modalCritical.title = "";
            }
            
            document.getElementById('modalTitle').innerHTML = title;
            document.getElementById('modalDescTitle').innerText = currentLang === 'en' ? uiDict.en.modalDescLabel : uiDict.es.modalDescLabel;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalImpactLabel').innerText = currentLang === 'en' ? uiDict.en.lblImpact : uiDict.es.lblImpact;
            document.getElementById('modalImpact').innerText = impact;
            document.getElementById('modalCloseBtn').innerText = currentLang === 'en' ? uiDict.en.btnClose : uiDict.es.btnClose;

            const linkElem = document.getElementById('modalExternalLink');
            if (item.url) {
                linkElem.href = item.url;
                linkElem.style.display = 'flex';
            } else {
                linkElem.style.display = 'none';
            }

            const modal = document.getElementById('featureModal');
            const modalContent = document.getElementById('featureModalContent');
            
            // Compensar scrollbar para evitar salto visual de layout sin ocultarla abruptamente
            const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
            if (scrollbarWidth > 0) {
                document.body.style.paddingRight = scrollbarWidth + 'px';
            }
            document.body.style.overflow = 'hidden';

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('featureModal');
            const modalContent = document.getElementById('featureModalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
                document.body.style.paddingRight = '';
            }, 250);
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'featureModal') {
                closeModal();
            }
        }

        function updateUI() {
            document.getElementById('headerTitle').innerText = uiDict[currentLang].headerTitle;
            document.getElementById('headerSubtitle').innerText = uiDict[currentLang].headerSubtitle;
            document.getElementById('summaryTitle').innerText = uiDict[currentLang].summaryTitle;
            document.getElementById('summaryText').innerText = uiDict[currentLang].summaryText;
            document.getElementById('lblPreview').innerText = uiDict[currentLang].lblPreview;
            document.getElementById('lblProduction').innerText = uiDict[currentLang].lblProduction;
            document.getElementById('datePreview').innerText = uiDict[currentLang].datePreview;
            document.getElementById('dateProduction').innerText = uiDict[currentLang].dateProduction;
            document.getElementById('lblCopy').innerText = uiDict[currentLang].lblCopy;
            
            document.getElementById('searchInput').placeholder = uiDict[currentLang].searchPlaceholder;
            document.getElementById('btnExport').title = uiDict[currentLang].tooltipExport;
            document.getElementById('btnCopySummary').title = uiDict[currentLang].tooltipCopy;
            document.getElementById('themeBtn').title = uiDict[currentLang].tooltipTheme;

            document.getElementById('lblViewDocs').innerText = uiDict[currentLang].lblViewDocs;
            
            // Actualizar etiqueta de idioma flotante con el idioma al que cambiará
            document.getElementById('langText').innerText = currentLang === 'en' ? 'ES' : 'EN';
            
            renderFilters();
            renderCards();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            updateUI();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            
            if (document.documentElement.classList.contains('dark')) {
                icon.classList.remove('fa-cloud-sun');
                icon.classList.add('fa-cloud-moon');
            } else {
                icon.classList.remove('fa-cloud-moon');
                icon.classList.add('fa-cloud-sun');
            }
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
            
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!localStorage.theme) {
                    if (e.matches) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    updateThemeIcon();
                }
            });
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }
        
        function exportToCSV() {
            if (!currentFilteredData || currentFilteredData.length === 0) return;
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            
            const headers = currentLang === 'en' 
                ? ["Module", "Type", "Critical", "Title", "Description", "Business Impact", "URL"]
                : ["Módulo", "Tipo", "Crítico", "Título", "Descripción", "Impacto en Negocio", "URL"];
            csvContent += headers.join(",") + "\r\n";
            
            currentFilteredData.forEach(item => {
                const title = currentLang === 'en' ? item.titleEn : item.titleEs;
                const desc = currentLang === 'en' ? item.descEn : item.descEs;
                const impact = currentLang === 'en' ? item.impactEn : item.impactEs;
                let typeText = item.type;
                if (currentLang === 'es') {
                    typeText = item.type === 'New' ? uiDict.es.typeNew : uiDict.es.typeChanged;
                }
                const critical = item.isCritical ? (currentLang === 'en' ? "Yes" : "Sí") : "No";
                
                const row = [
                    `"${item.module}"`,
                    `"${typeText}"`,
                    `"${critical}"`,
                    `"${title.replace(/"/g, '""')}"`,
                    `"${desc.replace(/"/g, '""')}"`,
                    `"${impact.replace(/"/g, '""')}"`,
                    `"${item.url || ''}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `MAPFRE_SAP_SFSF_2H2026_${currentLang}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function copySummary() {
            if (!currentOpenItemId) return;
            const item = releaseData.find(d => d.id === currentOpenItemId);
            if (!item) return;

            const title = currentLang === 'en' ? item.titleEn : item.titleEs;
            const desc = currentLang === 'en' ? item.descEn : item.descEs;
            const impact = currentLang === 'en' ? item.impactEn : item.impactEs;
            
            const summaryText = `[MAPFRE] SAP SuccessFactors 2H 2026 Release\n\nFeature: ${title}\n\n${currentLang === 'en' ? 'Description' : 'Descripción'}:\n${desc}\n\n${currentLang === 'en' ? 'Business Impact' : 'Impacto en el Negocio'}:\n${impact}\n\nURL: ${item.url || 'N/A'}`;
            
            const textArea = document.createElement("textarea");
            textArea.value = summaryText;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                const icon = document.getElementById('copyIcon');
                icon.className = 'fa-solid fa-check text-emerald-500 text-lg';
                const btn = document.getElementById('btnCopySummary');
                btn.title = uiDict[currentLang].tooltipCopied;
                
                setTimeout(() => {
                    icon.className = 'fa-regular fa-copy';
                    btn.title = uiDict[currentLang].tooltipCopy;
                }, 2000);
            } catch (err) {
                console.error('Oops, unable to copy', err);
            }
            document.body.removeChild(textArea);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateUI();
        });
    </script>
